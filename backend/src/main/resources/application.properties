spring.application.name=gotthard-spring

# --- database -----------------------------------------------------------
# Credentials come from the environment. The defaults are the throwaway
# container in docker-compose.yml, so a clean checkout runs with nothing set —
# but nothing real is ever baked into the jar.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/gotthard}
spring.datasource.username=${POSTGRES_USER:gotthard}
spring.datasource.password=${POSTGRES_PASSWORD:gotthard}

# Flyway owns the schema. Hibernate never touches it; it only validates that
# the entities and the migrations still agree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- runtime ------------------------------------------------------------
# Java 25. The workload is IO-bound (database, then a slow LLM call), which is
# exactly what virtual threads are for.
spring.threads.virtual.enabled=true

# --- observability ------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
