spring.application.name=gotthard-spring

# --- database -----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/gotthard
spring.datasource.username=gotthard
spring.datasource.password=gotthard

# Flyway owns the schema. Hibernate never touches it; it only validates that
# the entities and the migrations still agree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- runtime ------------------------------------------------------------
# Java 25. The workload is IO-bound (database, then a slow LLM call), which is
# exactly what virtual threads are for.
spring.threads.virtual.enabled=true

# --- observability ------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
