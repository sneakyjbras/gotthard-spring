spring.application.name=gotthard-spring

# --- database -----------------------------------------------------------
# Credentials come from the environment. The defaults are the throwaway
# container in docker-compose.yml, so a clean checkout runs with nothing set —
# but nothing real is ever baked into the jar.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/gotthard}
spring.datasource.username=${POSTGRES_USER:gotthard}
spring.datasource.password=${POSTGRES_PASSWORD:gotthard}

# Flyway owns the schema. Hibernate never touches it; it only validates that
# the entities and the migrations still agree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- runtime ------------------------------------------------------------
# Java 25. The workload is IO-bound (database, then a slow LLM call), which is
# exactly what virtual threads are for.
spring.threads.virtual.enabled=true

# --- observability ------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- AI analysis --------------------------------------------------------
# The key is read from the environment and is empty by default. Empty is not a
# misconfiguration: it is what selects the offline stub adapter, so a clean
# checkout demonstrates the whole analysis feature with nothing set. Export
# ANTHROPIC_API_KEY and the Claude adapter takes over — see
# ch.gotthard.ai.analysis.LlmClientConfiguration, which logs which one is live.
gotthard.ai.api-key=${ANTHROPIC_API_KEY:}
gotthard.ai.model=claude-opus-5
gotthard.ai.top-k-policy-chunks=6
gotthard.ai.max-tokens=4096

# --- risk watch lists -----------------------------------------------------
# Stands in for a sanctions or attribution feed a compliance function would
# subscribe to. FlaggedWallets is deliberately empty by default, because an
# empty watch list is a true statement about a system with no feed wired in.
# This value is the demo's own flagged address: the seeded chain runs
# Julian Meier -> Kenji Watanabe -> here, which is what rule R-05 measures.
gotthard.risk.flagged-wallets=${FLAGGED_WALLETS:0xccc381770f8d3f625f1bb854d6d0b228f22ea374}
