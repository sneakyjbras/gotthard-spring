apiVersion: v1
kind: Service
metadata:
  name: {{ include "gotthard.componentName" (dict "root" . "component" "backend") }}
  labels: {{- include "gotthard.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "gotthard.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
