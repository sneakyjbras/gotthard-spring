apiVersion: v1
kind: Service
metadata:
  name: {{ include "gotthard.componentName" (dict "root" . "component" "docs") }}
  labels: {{- include "gotthard.labels" (dict "root" . "component" "docs") | nindent 4 }}
spec:
  type: {{ .Values.docs.service.type }}
  selector: {{- include "gotthard.selectorLabels" (dict "root" . "component" "docs") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.docs.service.port }}
      targetPort: http
