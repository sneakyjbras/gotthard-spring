apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gotthard.componentName" (dict "root" . "component" "docs") }}
  labels: {{- include "gotthard.labels" (dict "root" . "component" "docs") | nindent 4 }}
spec:
  replicas: {{ .Values.docs.replicaCount }}
  selector:
    matchLabels: {{- include "gotthard.selectorLabels" (dict "root" . "component" "docs") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gotthard.labels" (dict "root" . "component" "docs") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gotthard.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: "{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
          imagePullPolicy: {{ .Values.docs.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.docs.resources | nindent 12 }}
