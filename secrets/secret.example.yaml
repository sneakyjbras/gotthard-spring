# TEMPLATE ONLY — do not fill in and commit. Copy to secret.yaml (gitignored,
# see .gitignore's "*.local" / add secrets/secret.yaml explicitly if you keep
# it in this directory), fill in real values, then:
#   kubectl -n <namespace> apply -f secrets/secret.yaml
#
# The chart NEVER templates these values — every chart template only
# references this Secret's NAME (values.yaml `secretName`, default
# "gotthard-secrets") via secretKeyRef. This is the one manual, out-of-band
# step before `helm install` will actually come up healthy.
#
# POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD are consumed by BOTH the
# postgres pod itself (bootstraps the database with them, same as the
# official postgres image's own env vars) and the backend (composes them into
# spring.datasource.url / .username / .password) — one credential, two
# consumers, so they can never drift apart.
#
# ANTHROPIC_API_KEY is OPTIONAL — omit the key entirely (not just leave it
# blank) and the backend's ANTHROPIC_API_KEY env var is simply never set
# (secretKeyRef optional: true in chart/templates/deployment-backend.yaml).
# That is the intended reviewer path: the app falls back to its offline stub
# AI adapter with nothing else to configure. Add the key only to switch the
# backend over to the real Claude adapter.
apiVersion: v1
kind: Secret
metadata:
  name: gotthard-secrets
  namespace: gotthard-qa
type: Opaque
stringData:
  POSTGRES_DB: "" # e.g. gotthard
  POSTGRES_USER: "" # e.g. gotthard
  POSTGRES_PASSWORD: "" # pick something real — this is not the docker-compose.yml throwaway
  ANTHROPIC_API_KEY: "" # optional — delete this line entirely to run the stub adapter
