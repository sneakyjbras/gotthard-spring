name: ci

on:
  push:
    branches: [main]
  pull_request:

# Free-tier discipline: one JDK, no matrix, caches on, fail fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two JDKs on purpose. Gradle itself runs on the LAST one listed (21),
      # because palantir-java-format reaches into javac internals that changed
      # in 25 and throws NoSuchMethodError there. 25 is installed alongside so
      # the Gradle toolchain compiles against it without downloading anything.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Format
        run: ./gradlew spotlessCheck --no-daemon
        working-directory: backend
      - name: Test
        run: ./gradlew test --no-daemon
        working-directory: backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks marketplace action exits 1 even on a clean scan (verified:
      # its own SARIF reported zero findings). The binary is deterministic and
      # has no licence check, so we run it directly.
      - name: Secret detection
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1
      - name: Dependency and filesystem CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Post-submission bonus (see CLAUDE.md's effort-split table): builds and
  # publishes the three demo images. Gated on `backend` + `security` passing
  # first and scoped to pushes on main only, so this never runs on a PR and
  # never publishes a build that failed tests or the secret/CVE scan.
  publish-images:
    name: Publish images (${{ matrix.image }})
    needs: [backend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Scoped to this job only — every other job keeps the default (read-only)
    # token permissions.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          # Build context is the repo root, not docs/ — mkdocs.yml and
          # requirements.txt live there (see docs/Dockerfile's own header).
          - image: docs
            context: .
            dockerfile: docs/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/sneakyjbras/gotthard-${{ matrix.image }}:${{ steps.sha.outputs.short }}
            ghcr.io/sneakyjbras/gotthard-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
